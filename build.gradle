plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	flatDir {
		dir 'libs'
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Forge 1.18.2 源码使用 official(mojmap) + parchment，这里保持 official 命名，
	// 使上游源码几乎可以原样编译，AccessTransformer 也只需换成等价 AccessWidener。
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 编译期注解（Forge 侧由 Forge 提供）
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	// Forge Config API Port：上游 TLMO 1.20.1 也用它，因此这里直接复用它提供的
	// net.minecraftforge.common.ForgeConfigSpec，配置代码可以按上游原样搬运，不必自造轮子。
	//
	// 用 libs/ 下的本地 jar：离线构建可用，版本也钉死不会漂移。
	// 注意：Loom 的 include（JiJ 打包）只接受模块坐标，不接受本地文件，
	// 因此这两个库需要在运行时另外安装（与上游 TLMO 的做法一致，
	// fabric.mod.json 里已用 depends 声明）。
	modImplementation files("libs/ForgeConfigAPIPort-v3.2.4-1.18.2-Fabric.jar")
	// Cloth Config：ForgeConfigAPIPort 的配置界面依赖它（仅客户端需要）
	modImplementation files("libs/cloth-config-6.5.133-fabric.jar")
	// Patchouli：可选的书籍 API，编译期依赖，运行时可选加载。
	modCompileOnly files("libs/Patchouli-1.18.2-71.1-FABRIC.jar")
	modLocalRuntime files("libs/Patchouli-1.18.2-71.1-FABRIC.jar")
	// night-config：ForgeConfigAPIPort 的配置读写依赖它。
	//
	// 原版 ForgeConfigAPIPort 是把这两个 jar 作为 JiJ（jar-in-jar）内嵌的，
	// 但 Loom 只对「正规模块坐标依赖」展开嵌套 jar，对 files() 本地文件不展开 ——
	// 于是开发环境启动时会报「requires any version of
	// com_electronwill_night-config_core, which is missing」。
	//
	// 解决办法：把它们从 ForgeConfigAPIPort 的 META-INF/jars 里解出来，
	// 单独作为模组依赖加入（这两个 jar 自带 fabric.mod.json，mod id 正是
	// com_electronwill_night-config_core / _toml，因此加载器能直接认到）。
	// 必须是 modImplementation（而非 compileOnly）：既要在编译期解析
	// ModLoadingContext#registerConfig 的签名，也要在运行期出现在 classpath 上。
	modImplementation files("libs/core-3.6.5.jar")
	modImplementation files("libs/toml-3.6.5.jar")

	// 说明：基岩版模型解析库（simplebedrockmodel）将在渲染里程碑中作为独立 Fabric 库接入，
	// 目前尚未使用，因此暂不加入依赖，避免启动期出现缺失 jar 的警告。
	// Fiber：Patchouli 用的配置库。Patchouli 的 Fabric 版把它作为 JiJ 内嵌在
	// META-INF/jars/fiber-0.23.0-2.jar 里，而 Loom 不展开 files() 本地依赖的
	// 嵌套 jar（和上面的 night-config 完全同一个坑），所以开发环境启动时会崩在
	// 入口点阶段：
	//   NoClassDefFoundError: io/github/fablabsmc/fablabs/api/fiber/v1/schema/type/derived/ConfigType
	//       at vazkii.patchouli.fabric.common.FabricModInitializer.onInitialize -> FiberPatchouliConfig.setup()
	// 该崩溃发生在窗口创建之前，Minecraft 只会弹出一个要手动关掉的崩溃对话框，
	// 表现得很像「卡死」。解决办法同上：从 Patchouli 的 META-INF/jars 里把它解出来，
	// 单独作为模组依赖加载（jar 自带 fabric.mod.json，mod id 为 fiber）。
	// 我们不对 Fiber 写代码，因此只需运行期存在，用 modLocalRuntime 即可。
	modLocalRuntime files("libs/fiber-0.23.0-2.jar")
	// snakeyaml：AI 聊天子系统读取 available_sites.yml / 角色设定 settings/*.yml 用。
	//
	// 上游两份产物都自带它（Forge 1.18.2 走 JiJ 的 snakeyaml-2.4.jar，
	// TLMO 1.20.1 则把类重定位到 touhoulittlemaid.libs.org.yaml.snakeyaml）。
	// 这里直接从上游 Forge jar 的 META-INF/jarjar 里解出来放进 libs/，
	// 与 night-config 的做法一致：离线可用、版本钉死。
	// 它不是一个 mod（没有 fabric.mod.json），所以用 implementation 而不是 modImplementation。
	// 注意：implementation 只把它们放进开发环境的 runtimeClasspath，**不会**进产物 jar ——
	// 真正让它们进 jar 的是本文件末尾 jar { from(zipTree(...)) } 那三段。
	implementation files("libs/snakeyaml-2.4.jar")
	// concentus：纯 Java 的 Opus 解码器（上游 Forge 版通过 JiJ 内嵌 1.0.2）。
	// vorbis-java-core：拆 ogg 容器，负责把 opus 的音频包一个个喂给 concentus。
	// 两者都是 TTS 播放链路（ai/service/tts + client/sound）的硬依赖，
	// 同样从上游 Forge jar 的 META-INF/jarjar 里解出来放进 libs/，离线可用。
	// 它们不是 mod（没有 fabric.mod.json），因此用 implementation。
	implementation files("libs/concentus-1.0.2.jar")
	implementation files("libs/vorbis-java-core-0.8.jar")
        // ------------------------------------------------------------------ 可选联动（REI）
        //
        // REI 里要能看到「祭坛合成」这一分类，靠的是我们自己写一个
        // me.shedaniel.rei.api.client.plugins.REIClientPlugin 实现，并把它登记在
        // fabric.mod.json 的 rei_client 入口点里 —— REI 启动时才会去找这个入口点，
        // 没装 REI 时这段代码根本不会被加载，所以这里是可选依赖（compileOnly），
        // 绝不写进 fabric.mod.json 的 depends。
        //
        // 注意 REI 8.4.778 的 jar 里没有声明对 architectury 的依赖（虽然它的核心类
        // 直接引用 dev.architectury.platform.*），所以编译期必须把 architectury 也放上
        // classpath，否则 javac 解析 REI 的 API 签名时会报「找不到符号」。
        // 运行期同理：装 REI 就必须同时装 Architectury API，这是 REI 自己的要求。
        modCompileOnly files("libs/REI-RoughlyEnoughItems-8.4.778-fabric-1.18.2.jar")
        modCompileOnly files("libs/architectury-4.12.94-fabric.jar")
        // basic-math：REI 的坐标类（me.shedaniel.math.Point / Rectangle）在这里。
        // REI 把它当独立库用，但它的 jar 里既没有这 7 个类，也没有在 fabric.mod.json
        // 里声明依赖，所以编译期必须显式放上 classpath。
        modCompileOnly files("libs/basic-math-0.6.1.jar")
        // modLocalRuntime：让 gradlew runClient 里真的带上 REI，用来做端到端验证。
        // 只影响开发环境，不会进最终 jar（Loom 的 localRuntime 不参与 remapJar）。
        modLocalRuntime files("libs/REI-RoughlyEnoughItems-8.4.778-fabric-1.18.2.jar")
        modLocalRuntime files("libs/architectury-4.12.94-fabric.jar")
        modLocalRuntime files("libs/basic-math-0.6.1.jar")

        // ------------------------------------------------------------------ 可选联动（ModMenu）
        //
        // 上游 1.20.1 Fabric 版把「模组列表里的配置齿轮」交给 ModMenu 的
        // `modmenu` 入口点。这里同样如此：只在编译期与开发运行期需要 ModMenu，
        // 正式产物的 fabric.mod.json 里**不写** depends —— 没装 ModMenu 时
        // 入口点不会被执行，玩家改用「打开配置界面」按键（默认未绑定）。
        modCompileOnly files("libs/modmenu-3.2.5.jar")
        modLocalRuntime files("libs/modmenu-3.2.5.jar")

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// 固定开发客户端的玩家名。
//
// Loom 默认每次启动都会随机生成一个玩家名（日志里的 "Setting user: Player857"），
// 而离线模式下的 UUID 是 MD5("OfflinePlayer:" + name) —— 名字一变 UUID 就变，
// 于是「上一轮训好的女仆」在新的一轮里 owner 对不上，表现为【女仆完全无法交互】。
// 固定名字后 UUID 稳定，跨次启动的存档数据才有意义。
loom {
	runs {
		client {
			programArgs "--username", "Dev"
			// 可选：让 runClient 直接连到本仓库的 runServer。
			//
			// 用来端到端验证「客户端真的画得出来」。缺渲染器这类 bug 服务端完全看不到
			// （实体能生成、能 tick，/summon 一切正常），只有客户端渲染循环才会炸，
			// 而且崩在 LevelRenderer 里，堆栈跟出问题的实体毫无关系。
			//
			// 用法：
			//   gradlew runServer            （另开一个终端）
			//   gradlew runClient -PjoinServer
			// 然后用 RCON 在玩家脚边 /summon 目标实体。
			// 不带这个属性时行为与以前完全一致。
			if (project.hasProperty('joinServer')) {
				programArgs "--server", "127.0.0.1", "--port", "25565"
			}
			// 配置界面自检。加 -PclothSelftest 启动时会给客户端 JVM 带上
			// -Dfuto.cloth.selftest=true，于是 compat/cloth/ClothConfigSelfTest
			// 会在标题画面出现后自动构建、打开并保存一次配置界面，把结果写进日志。
			//
			// 为什么用 Gradle 属性而不是直接 jvmArgs 常量：日常构建与 runClient
			// 不该带上它 —— 自检会把界面顶到前台，还会改一次 toml（随即还原）。
			// 用法：gradlew runClient -PclothSelftest
			if (project.hasProperty('clothSelftest')) {
				vmArgs "-Dfuto.cloth.selftest=true"
			}

		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

java {
	// 编译与运行游戏都用 JDK 17（Gradle 守护进程本身需要 21，由 JAVA_HOME 提供）。
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	// ------------------------------------------------------------------
	// 把三个「纯 Java、且不是 mod」的库合并进主 jar。
	//
	// 为什么必须这样：`implementation files(...)` 只把它们放到 Gradle 的
	// runtimeClasspath 上 —— 也就是**只对 `gradlew runClient` 有效**。产出的 jar
	// 里没有它们，玩家把 jar 丢进自己的 mods 目录后会在启动阶段炸：
	//
	//   java.lang.NoClassDefFoundError: org/yaml/snakeyaml/Yaml
	//       at ...ai.manager.setting.AvailableSites.readSites
	//       at ...config.subconfig.AIConfig.init
	//
	// 也不能改用 Loom 的 `include`：那会把 jar 塞进 META-INF/jars 交给 Fabric Loader
	// 当作**独立 mod** 加载，而这三个 jar 里都没有 fabric.mod.json，加载器会拒绝。
	// 所以直接把类合并进来。
	//
	// 排除项只留「合并后会坏掉」的那几类：
	//   - MANIFEST / 签名：多个 MANIFEST 合并没有意义，签名与合并后的内容也不再匹配；
	//   - module-info：snakeyaml 带 META-INF/versions/9/module-info.class（multi-release），
	//     而本 jar 的 MANIFEST 没有 Multi-Release: true，留着反而可能被误解析。
	// META-INF/maven/**（里面有各自的 pom 与 LICENSE）**不排除** —— 那是版权声明。
	// ------------------------------------------------------------------
	from(zipTree("libs/snakeyaml-2.4.jar")) {
		exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
		exclude 'META-INF/versions/**', 'module-info.class'
	}
	from(zipTree("libs/concentus-1.0.2.jar")) {
		exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
		exclude 'META-INF/versions/**', 'module-info.class'
	}
	from(zipTree("libs/vorbis-java-core-0.8.jar")) {
		exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
		exclude 'META-INF/versions/**', 'module-info.class'
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ---------------------------------------------------------------------------
// 离线检查：隙间（无线 IO）的搬运规则
//
// 为什么需要它：隙间「女仆 -> 箱子」那一半在专用服务器上根本观察不到 —— 没有玩家在线时
// 区块几秒后就不再 tick，女仆随之停摆，测什么都是「没动」。而搬运本身只是两个
// IItemHandler 之间的算术，完全可以脱离世界跑。
//
// 用法：  gradlew verifyWirelessIo
//
// 这套 sourceSet 只把 port/verify-wireless-io 编进 verify 这一路，主 sourceSet 与最终 jar
// 都不受影响；被检查的 WirelessIOTransfer 用的是 main 的编译产物，也就是真正会打进
// jar 的那一份。
// ---------------------------------------------------------------------------
sourceSets {
        verify {
                java.srcDirs = ['port/verify-wireless-io']
                compileClasspath += sourceSets.main.output + configurations.compileClasspath
                runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
        }
}

tasks.register('verifyWirelessIo', JavaExec) {
        group = 'verification'
        description = 'Runs the offline gap (wireless I/O) transfer check.'
        dependsOn tasks.named('verifyClasses')
        classpath = sourceSets.verify.runtimeClasspath
        mainClass = 'com.github.tartaricacid.touhoulittlemaid.item.bauble.TransferCheck'
}

// 说明：这里故意不声明 loom.accessWidenerPath。
// 上游用 Forge AT 打开了 SensorType/Activity/MemoryModuleType 的私有构造函数与
// Brain#lastScheduleUpdate，本移植版改为「反射 + 行为自带时间戳」实现（见 MaidReflection），
// 因为 Loom 1.15 要求 classTweaker 表头、而 Fabric Loader 0.14.25 只认 accessWidener 表头，
// 同一份文件无法同时满足两者。