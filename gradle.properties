# Increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Gradle daemon JVM: MUST be Java 21.
#
# Loom 1.15 refuses to configure the build on anything older:
#   "Dependency requires at least JVM runtime version 21."
# On this machine JAVA_HOME is empty and the `java` on PATH is a Java 17 JRE,
# so Gradle would fall back to 17 and die before doing anything. Pinning the
# daemon JVM here makes `.\gradlew.bat runClient` work regardless of the shell
# environment. Adjust the path if the bundled JDK ever moves.
# ---------------------------------------------------------------------------
org.gradle.java.home=D:/codename_EndDavid/hello java/jdk-21.0.2

# Make the toolchain resolvable too: 21 runs Gradle, 17 compiles the mod.
org.gradle.java.installations.paths=D:/codename_EndDavid/hello java/jdk-21.0.2,C:/Program Files/Java/jdk-17

# Fabric Properties
minecraft_version=1.18.2

# Modpack requirement: Fabric Loader 0.14.25 (do not bump).
loader_version=0.14.25

# Pinned to a concrete release instead of "1.15-SNAPSHOT".
# The snapshot is a moving target and already broke once: a newer snapshot
# build started requiring Java 21 while Gradle was still running on 17.
loom_version=1.15.5

# Mod Properties
# Gradle derives the jar name from this value, so the artifact is
#   build/libs/touhoulittlemaid-fabric-1.18.2-futo-1.1-futo.jar
mod_version=1.1-futo
maven_group=com.github.tartaricacid
archives_base_name=touhoulittlemaid-fabric-1.18.2-futo

# Dependencies
fabric_api_version=0.77.0+1.18.2